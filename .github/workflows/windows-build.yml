name: Windows build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-build.yml
      - github-desktop-companion/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/windows-build.yml
      - github-desktop-companion/**

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: github-desktop-companion

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: github-desktop-companion/package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Type-check
        run: npm run typecheck

      - name: Build Windows distributions
        run: npm run dist:win

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File -Filter '*.exe' | Sort-Object Name
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          Set-Content -Path release/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-desktop-companion-windows-x64-${{ github.sha }}
          path: |
            github-desktop-companion/release/*.exe
            github-desktop-companion/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
